[package]
name = "regressee-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
developer-tools = []

[dependencies]
regressee-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
zeroize = "=1.9.1"
aes-gcm = { version = "=0.10.3", features = ["std"] }
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true
url.workspace = true
ed25519-dalek = "=2.2.0"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
tar = { version = "=0.4.44", default-features = false }
flate2 = "=1.1.10"
libc = "=0.2.177"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls"] }
tokio = { version = "=1.50.0", features = ["rt", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Pipes", "Win32_Security"] }
