[package]
name = "regressee-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
regressee-app = { path = "../app" }
regressee-core = { path = "../core" }
regressee-storage = { path = "../storage" }
regressee-runtime = { path = "../runtime" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tempfile.workspace = true
tokio = { version = "=1.50.0", features = ["rt", "signal"] }

[dev-dependencies]
tempfile.workspace = true
anyhow.workspace = true
regressee-app = { path = "../app", features = ["test-support"] }
png = "=0.17.16"
libc = "=0.2.177"
ed25519-dalek = "=2.2.0"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
sha2.workspace = true
hex.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[[bin]]
name = "regressee"
path = "src/main.rs"
