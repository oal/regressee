[package]
name = "regressee-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
ui = ["dep:gpui", "dep:image", "dep:log"]
developer-tools = ["regressee-app/developer-tools", "regressee-runtime/developer-tools"]
test-support = ["regressee-app/test-support"]
ui-tests = ["ui", "test-support", "gpui/test-support"]
ui-inspection = ["ui", "developer-tools", "dep:libc"]
ui-renderer-capture = ["ui-tests", "developer-tools", "gpui/offscreen-capture"]

[dependencies]
regressee-app = { path = "../app" }
regressee-core = { path = "../core" }
regressee-storage = { path = "../storage" }
regressee-runtime = { path = "../runtime" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
url.workspace = true
tempfile.workspace = true
png = "=0.17.16"
image = { version = "=0.25.10", default-features = false, optional = true }
gpui = { workspace = true, optional = true }
log = { version = "=0.4.34", optional = true }
libc = { version = "=0.2.177", optional = true }

[dev-dependencies]
regressee-app = { path = "../app", features = ["test-support"] }
ed25519-dalek = "=2.2.0"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[[bin]]
name = "regressee-desktop"
path = "src/main.rs"
required-features = ["ui"]
