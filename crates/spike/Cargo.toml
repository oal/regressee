[package]
name = "regressee-spike"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[features]
default = []
ui = ["dep:gpui", "regressee-app/ui"]

[dependencies]
regressee-runtime = { path = "../runtime" }
regressee-app = { path = "../app", default-features = false }
anyhow = "=1.0.100"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
hex = "=0.4.3"
ed25519-dalek = "=2.2.0"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
png = "=0.17.16"
libc = "=0.2.177"
gpui = { version = "=0.2.2", optional = true }
tempfile.workspace = true

[[bin]]
name = "regressee-spike"
path = "src/main.rs"

[[bin]]
name = "regressee-ui"
path = "src/ui.rs"
required-features = ["ui"]
