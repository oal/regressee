[workspace]
members = ["crates/spike", "crates/core", "crates/storage", "crates/runtime", "crates/app"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = "=1.0.100"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
hex = "=0.4.3"
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
url = { version = "=2.5.8", features = ["serde"] }
tempfile = "=3.25.0"
gpui = "=0.2.2"

[profile.dev]
debug = 0

[profile.test]
debug = 0
