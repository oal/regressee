name: Downloadable Linux and Windows previews

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            rustflags: ''
          - os: windows-2025
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            # A portable .exe must not need the separately installed MSVC CRT.
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '4'
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the native Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Locate Windows release shader and inspection tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem "$sdk\*\x64\fxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe was not found' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC tools were not found' }
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found' }
          "REGRESSEE_DUMPBIN=$($dumpbin.FullName)" >> $env:GITHUB_ENV
      - name: Test preview packaging
        shell: bash
        run: |
          python -B scripts/test_ci_run.py
          python -B scripts/test_package_preview.py
          python -B scripts/test_release_preview.py
          python -B scripts/test_cli_consumer_fixture.py
          python -B scripts/test_skill_frontmatter.py
          python -B scripts/test_environment_boundaries.py
      - name: Test private-source omission and completeness policy
        if: runner.os == 'Linux'
        run: python -B scripts/test_source_release.py --report "$RUNNER_TEMP/source-release-tests.json"
      - name: Run application contract tests
        # Retain the full bulk suite with the same cold-host budget as CI.
        timeout-minutes: 45
        run: python scripts/ci-run.py cargo test --locked --workspace --features regressee-app/test-support --target ${{ matrix.target }}
      - name: Build production CLI and desktop (never all-features)
        run: python -B scripts/release-preview.py --target ${{ matrix.target }} --product all --output artifacts/preview
      - name: Inspect the CLI-only dependency closure
        shell: bash
        run: |
          cargo tree --locked --offline -p regressee-cli --target ${{ matrix.target }} --edges normal,build --prefix none --format '{p}' > cli-dependencies.txt
          python - <<'PY'
          from pathlib import Path
          names = {line.split(' v')[0] for line in Path('cli-dependencies.txt').read_text().splitlines()}
          if names & {'gpui', 'regressee-gui'}:
              raise SystemExit('CLI dependency closure contains the GUI')
          PY
          rm cli-dependencies.txt
      - name: Check Linux ABI and dynamic dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          import re, subprocess
          for name in ('regressee', 'regressee-desktop'):
              binary = 'target/x86_64-unknown-linux-gnu/release/' + name
              needed = subprocess.check_output(['readelf', '-d', binary], text=True)
              print(name, needed)
              if name == 'regressee' and re.search(r'lib(?:X11|xcb|wayland|vulkan|GL|EGL|xkbcommon|stdc\+\+)', needed):
                  raise SystemExit('CLI unexpectedly links GUI libraries')
              output = subprocess.check_output(['readelf', '--version-info', binary], text=True)
              versions = {tuple(map(int, v.split('.'))) for v in re.findall(r'GLIBC_(\d+\.\d+)', output)}
              if not versions or max(versions) > (2, 39):
                  raise SystemExit('Linux previews must meet GLIBC <= 2.39')
              print(name, 'highest required GLIBC:', '.'.join(map(str, max(versions))))
          PY
      - name: Check Windows DLL dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in @('regressee.exe', 'regressee-desktop.exe')) {
            $dependencies = & $env:REGRESSEE_DUMPBIN /dependents "target/x86_64-pc-windows-msvc/release/$name"
            if ($LASTEXITCODE -ne 0) { throw 'DLL dependency inspection failed' }
            $dependencies
            if (($dependencies -join "`n") -match '(?i)(?:VCRUNTIME|MSVCP|MSVCR)\d+[^\s]*\.dll') {
              throw 'The portable preview unexpectedly requires the MSVC redistributable'
            }
            if ($name -eq 'regressee.exe' -and ($dependencies -join "`n") -match '(?i)(?:vulkan|d3d\d*|opengl32)\.dll') {
              throw 'CLI unexpectedly requires graphics libraries'
            }
          }
      - name: Upload build downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: regressee-${{ matrix.platform }}
          path: artifacts/preview/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish test preview
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: regressee-*
          path: artifacts/platforms
      - name: Include the exact application source and checksums
        shell: bash
        run: |
          mkdir -p artifacts/preview
          python - <<'PY'
          from pathlib import Path
          import shutil
          output = Path('artifacts/preview')
          for platform in sorted(Path('artifacts/platforms').iterdir()):
              for file in sorted(platform.iterdir()):
                  destination = output / file.name
                  if destination.exists():
                      if destination.read_bytes() != file.read_bytes():
                          raise SystemExit('Cross-platform source/archive identity mismatch: ' + file.name)
                  else:
                      shutil.copyfile(file, destination)
          PY
          cd artifacts/preview
          test -s regressee-desktop-windows-x86_64.zip
          test -s regressee-desktop-linux-x86_64.tar.gz
          test -s regressee-cli-windows-x86_64.zip
          test -s regressee-cli-linux-x86_64.tar.gz
          sha256sum regressee-* > SHA256SUMS
      - name: Publish only after both builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="preview-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Downloads for testing

          - **Desktop:** extract `regressee-desktop-windows-x86_64.zip` or `regressee-desktop-linux-x86_64.tar.gz`. Keep both separate executables together; launch `regressee-desktop`. Linux needs GPUI libraries and a working graphics backend. These are portable directories, not installers/AppImages.
          - **CLI-only:** extract `regressee-cli-windows-x86_64.zip` or `regressee-cli-linux-x86_64.tar.gz`, then run `regressee --help`. No GPUI/display is required. Headless capture is public-only and still requires browser OS libraries/fonts and its default sandbox.
          - All packages include help, portable skill, notices, per-executable metadata/source inventory and checksums. `regressee-source.tar.gz` contains the selected application sources, including patched GPUI and public docs/skill, excluding private data and internal review/evidence documents. `regressee-source.json` records exact selected hashes.

          These are **unsigned, experimental test builds**, not supported production releases or installers. Windows may show a publisher/reputation warning. Browser setup needs internet access on first use; the application downloads its pinned private runtime. Native desktop, clean-install, accessibility, and complete license qualification remain pending. macOS is not included. Do not disable OS/browser security protections to make a test pass.

          Dependency license texts and product/target-specific inventories are included. Checksums detect corruption, not publisher authenticity. See release-building and support-matrix documents for requirements and known limitations.
          NOTES
          printf '\n' >> "$RUNNER_TEMP/release-notes.md"
          cat docs/preview-release-notes.md >> "$RUNNER_TEMP/release-notes.md"
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
          # Never overwrite a published preview. Failed uploads leave a draft,
          # rather than exposing a release with only some of its downloads.
          gh release create "$tag" artifacts/preview/* \
            --target "$GITHUB_SHA" --title "Regressee test preview — $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease --latest=false --draft
          gh release edit "$tag" --draft=false
