name: Downloadable Linux and Windows previews

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            rustflags: ''
          - os: windows-2025
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            # A portable .exe must not need the separately installed MSVC CRT.
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '4'
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the native Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Locate Windows release shader and inspection tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem "$sdk\*\x64\fxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe was not found' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC tools were not found' }
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found' }
          "REGRESSEE_DUMPBIN=$($dumpbin.FullName)" >> $env:GITHUB_ENV
      - name: Test preview packaging
        shell: bash
        run: |
          python -B scripts/test_ci_run.py
          python -B scripts/test_package_preview.py
      - name: Run application contract tests
        timeout-minutes: 30
        run: python scripts/ci-run.py cargo test --locked --workspace --features regressee-app/test-support --target ${{ matrix.target }}
      - name: Build the desktop application
        run: cargo build --release --locked -p regressee-app --features ui --bin regressee --target ${{ matrix.target }}
      - name: Check Linux ABI and dynamic dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary=target/x86_64-unknown-linux-gnu/release/regressee
          readelf -d "$binary"
          python - <<'PY'
          import re, subprocess
          output = subprocess.check_output(['readelf', '--version-info', 'target/x86_64-unknown-linux-gnu/release/regressee'], text=True)
          versions = {tuple(map(int, v.split('.'))) for v in re.findall(r'GLIBC_(\d+\.\d+)', output)}
          if not versions or max(versions) > (2, 39):
              raise SystemExit('Linux preview must meet the Ubuntu 24.04 GLIBC <= 2.39 floor')
          print('Highest required GLIBC:', '.'.join(map(str, max(versions))))
          PY
      - name: Check Windows DLL dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dependencies = & $env:REGRESSEE_DUMPBIN /dependents target/x86_64-pc-windows-msvc/release/regressee.exe
          if ($LASTEXITCODE -ne 0) { throw 'DLL dependency inspection failed' }
          $dependencies
          if (($dependencies -join "`n") -match '(?i)(?:VCRUNTIME|MSVCP|MSVCR)\d+[^\s]*\.dll') {
            throw 'The portable preview unexpectedly requires the MSVC redistributable'
          }
      - name: Package the preview and dependency notices
        env:
          PREVIEW_TARGET: ${{ matrix.target }}
          PREVIEW_REVISION: ${{ github.sha }}
        run: python -B scripts/package-preview.py --target "$PREVIEW_TARGET" --revision "$PREVIEW_REVISION" --output artifacts/preview
        shell: bash
      - name: Upload build downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: regressee-${{ matrix.platform }}
          path: artifacts/preview/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish test preview
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: regressee-*
          path: artifacts/preview
          merge-multiple: true
      - name: Include the exact application source and checksums
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=regressee-source/ --output=artifacts/preview/regressee-source.tar.gz "$GITHUB_SHA"
          cd artifacts/preview
          test -s regressee-windows-x86_64.exe
          test -s regressee-windows-x86_64.zip
          test -s regressee-linux-x86_64.tar.gz
          sha256sum regressee-* > SHA256SUMS
      - name: Publish only after both builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="preview-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Downloads for testing

          - **Windows 11 x64:** download `regressee-windows-x86_64.exe` and run it. No Rust, Node.js, npm, or Playwright installation is needed. The `.zip` also includes help and third-party notices.
          - **Linux x64:** extract `regressee-linux-x86_64.tar.gz` and run `./regressee-linux-x86_64/regressee` on Ubuntu 24.04 or a compatible system with GPUI's shared libraries and a working graphics backend. This is not an AppImage.
          - `SHA256SUMS` verifies download integrity; `regressee-source.tar.gz` contains the exact application sources, including the patched GPUI.

          These are **unsigned, experimental test builds**, not supported production releases or installers. Windows may show a publisher/reputation warning. Browser setup needs internet access on first use; the application downloads its pinned private runtime. Native desktop, clean-install, accessibility, and complete license qualification remain pending. macOS is not included. Do not disable OS/browser security protections to make a test pass.

          Dependency license texts and a target-specific inventory are included in each platform archive. Download the Windows ZIP as well if you use the standalone EXE. See the repository's release-building and support-matrix documents for requirements and known limitations.
          NOTES
          printf '\n' >> "$RUNNER_TEMP/release-notes.md"
          cat docs/preview-release-notes.md >> "$RUNNER_TEMP/release-notes.md"
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
          # Never overwrite a published preview. Failed uploads leave a draft,
          # rather than exposing a release with only some of its downloads.
          gh release create "$tag" artifacts/preview/* \
            --target "$GITHUB_SHA" --title "Regressee test preview — $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease --latest=false --draft
          gh release edit "$tag" --draft=false
