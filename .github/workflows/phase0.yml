name: Phase 0 executable harness (not runtime qualification)
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to check (all preserves the normal matrix)
        type: choice
        default: all
        options: [all, ubuntu-24.04, windows-2025, macos-14]
  push:
    paths: ['crates/**', 'vendor/**', 'worker/**', 'scripts/**', 'Cargo.*', 'rust-toolchain.toml', '.gitattributes', '.github/**']
  pull_request:
    paths: ['crates/**', 'vendor/**', 'worker/**', 'scripts/**', 'Cargo.*', 'rust-toolchain.toml', '.gitattributes', '.github/**']
permissions:
  contents: read
jobs:
  spike:
    # Includes bulk contracts, private runtime setup and native compilation.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.runner == 'all' || inputs.runner == '') && '["ubuntu-24.04","windows-2025","macos-14"]' || format('["{0}"]', inputs.runner)) }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '4'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      REGRESSEE_PHASE0_WORKER_STDERR: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Offline CI launcher contracts
        run: python -B scripts/test_ci_run.py
      - name: Rust core tests
        # Windows hit 30m without an assertion failure in run 38324688313.
        timeout-minutes: 45
        run: python scripts/ci-run.py cargo test --locked --workspace --features regressee-app/test-support
      - name: Build local private runtime pack source
        run: python scripts/bootstrap.py
      - name: Install Linux browser shared-library prerequisites
        if: runner.os == 'Linux'
        run: .runtime/source/node/bin/node .runtime/source/worker/node_modules/playwright/cli.js install-deps chromium
      - name: Permit pinned browser sandbox under hosted AppArmor policy
        if: runner.os == 'Linux'
        run: python scripts/ci-linux-browser.py
      - name: Check private sandboxed browser startup with visible errors
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then node=.runtime/source/node/node.exe; else node=.runtime/source/node/bin/node; fi
          PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.runtime/source/browsers" "$node" --input-type=module -e '
            import { chromium } from "./.runtime/source/worker/node_modules/playwright/index.mjs";
            const browser = await chromium.launch({ channel: "chromium", headless: true, chromiumSandbox: true });
            await browser.close();
          '
      - name: Package, provision and smoke (no system Node)
        shell: bash
        run: |
          cargo run --locked --bin regressee-spike -- pack
          cargo run --locked --bin regressee-spike -- repair
          cargo run --locked --bin regressee-spike -- smoke
          cargo run --locked --bin regressee-spike -- protocol-test
      - name: GPUI compile on Windows/macOS (not opening-window evidence)
        if: runner.os != 'Linux'
        run: cargo build --locked --workspace --features regressee-gui/ui,regressee-spike/ui --bins
