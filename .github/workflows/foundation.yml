name: Foundation checks (not desktop qualification)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pinned toolchain
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - name: UI-inclusive API and lint check on every target
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Native link and simulated GPUI tests (Windows/macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo build --locked --workspace --features ui --bins
          cargo test --locked --workspace --all-features
      - name: Linux native link prerequisites remain an explicit gate
        if: runner.os == 'Linux'
        run: cargo build --locked --workspace --features ui --bins
        # The runner must supply GPUI's native development libraries. This
        # workflow never installs global packages or weakens sandboxing. Failure
        # for missing libraries is visible, not skipped or called qualification.
