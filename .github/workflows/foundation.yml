name: Foundation checks (not desktop qualification)
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to check (all preserves the normal matrix)
        type: choice
        default: all
        options: [all, ubuntu-24.04, windows-2025, macos-14]
  push:
    paths: ['crates/**', 'vendor/**', 'worker/**', 'scripts/**', 'Cargo.*', 'rust-toolchain.toml', '.gitattributes', '.github/**']
  pull_request:
    paths: ['crates/**', 'vendor/**', 'worker/**', 'scripts/**', 'Cargo.*', 'rust-toolchain.toml', '.gitattributes', '.github/**']
permissions:
  contents: read
jobs:
  cli-only:
    name: CLI dependency boundary (no GUI setup)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PKG_CONFIG: /bin/false
      DISPLAY: ''
      WAYLAND_DISPLAY: ''
      DBUS_SESSION_BUS_ADDRESS: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Deliberately do not use the native GUI SDK/library setup action.
      - run: cargo build --locked -p regressee-cli --bin regressee
      - run: cargo test --locked -p regressee-cli
      - name: Assert the selected dependency closure excludes GPUI
        run: |
          python3 - <<'PY'
          import subprocess
          graph = subprocess.check_output(['cargo', 'tree', '--locked', '-p', 'regressee-cli', '--edges', 'normal,build', '--prefix', 'none', '--format', '{p}'], text=True)
          assert not any(line.startswith(('gpui ', 'regressee-gui ')) for line in graph.splitlines()), graph
          print(graph)
          PY
      - run: target/debug/regressee --help
      - run: target/debug/regressee --build-info
  contracts:
    # Hosted 4f84363 took up to 54m39s; keep cold-host headroom bounded.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.runner == 'all' || inputs.runner == '') && '["ubuntu-24.04","windows-2025","macos-14"]' || format('["{0}"]', inputs.runner)) }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '4'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo fmt --all -- --check
      - name: Offline CI launcher and preview packaging contracts
        shell: bash
        run: |
          python -B scripts/test_ci_run.py
          python -B scripts/test_package_preview.py
          python -B scripts/test_environment_boundaries.py
      - name: Linux-only private source archive contracts
        if: runner.os == 'Linux'
        shell: bash
        run: python -B scripts/test_source_release.py --report "$RUNNER_TEMP/source-release-tests.json"
      - name: Application contracts including distinct persisted bulk qualification
        timeout-minutes: 45
        run: python scripts/ci-run.py cargo test --locked --workspace --features regressee-app/test-support
      - name: UI-inclusive API and lint check on every target
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Native link and simulated GPUI tests (not desktop launch)
        timeout-minutes: 45
        shell: bash
        run: |
          cargo build --locked --workspace --features regressee-gui/ui,regressee-spike/ui --bins
          python scripts/ci-run.py cargo test --locked --workspace --all-features
