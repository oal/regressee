name: Private target checks (not release or desktop qualification)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-check:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install exact Rust target and inspect hosted SDK tools
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          rustup target list --installed
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --workspace --all-features --all-targets --target ${{ matrix.target }}
      - run: cargo test --locked --workspace --all-features --target ${{ matrix.target }} -- --test-threads=1
      - run: cargo clippy --locked --workspace --all-features --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo build --release --locked -p regressee-app --features ui --bin regressee --target ${{ matrix.target }}
      - name: Linux ABI inspection, default-policy sandbox still a separate native gate
        if: runner.os == 'Linux'
        run: |
          readelf -d target/${{ matrix.target }}/release/regressee
          readelf --version-info target/${{ matrix.target }}/release/regressee
      - name: macOS architecture/deployment/dependency inspection
        if: runner.os == 'macOS'
        run: |
          lipo -info target/${{ matrix.target }}/release/regressee
          otool -L target/${{ matrix.target }}/release/regressee
          otool -l target/${{ matrix.target }}/release/regressee
      # No artifact upload, signing, secret access, vendor submission or dispatch
      # occurs without explicit owner execution. Windows Server CI is not Win11
      # standard-user desktop; Mac compilation cannot pass blocked supervision.
